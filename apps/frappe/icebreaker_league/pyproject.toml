[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icebreaker_league"
version = "0.1.0"
description = "IceBreaker central hockey league administration for Frappe Framework"
requires-python = ">=3.14"
dependencies = ["cryptography>=44,<49"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["icebreaker_league*"]

[project.optional-dependencies]
observability = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]

[tool.setuptools.package-data]
icebreaker_league = ["modules.txt", "patches.txt", "**/*.json"]
