<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark"><title>IceBreaker — Broadcast Overlay</title>
<style>
:root{--blue:#1468ac;--orange:#df713b;--glass:rgba(8,22,41,.89);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff;background:transparent}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}#overlay{position:absolute;left:3.5vw;right:3.5vw;bottom:4vh;max-width:1480px;margin:auto;filter:drop-shadow(0 8px 24px #0008)}.board{border-radius:16px;overflow:hidden;display:grid;grid-template-columns:minmax(150px,1fr) 96px minmax(150px,1fr) 96px 190px;align-items:stretch;background:var(--glass);outline:1px solid #fff3;min-height:114px}.team{padding:18px 22px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}.team.home{border-left:9px solid var(--blue)}.team.away{border-left:9px solid var(--orange)}.name{font-size:clamp(14px,1.55vw,25px);font-weight:800;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat{font-size:clamp(12px,.95vw,17px);font-weight:600;color:#c9d9e9}.score{display:grid;place-items:center;font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(42px,4vw,70px);border-inline:1px solid #fff2}.score.home{background:#123d64}.score.away{background:#703521}.clockbox{background:#08111f;padding:11px 15px;display:flex;flex-direction:column;justify-content:center;align-items:center;border-left:2px solid #ffffff29}.clock{font-size:clamp(29px,2.9vw,53px);font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}.period{font-size:14px;text-transform:uppercase;letter-spacing:.13em;color:#bcd0e5;font-weight:800}.strip{display:flex;justify-content:space-between;align-items:center;gap:15px;background:#061525d9;padding:7px 16px;border-radius:0 0 12px 12px;font-size:13px;font-weight:700;letter-spacing:.04em}.status{color:#9ecae8}.status.lost{color:#ffc78b}.penalty{color:#ffe49a}.offline{position:absolute;right:0;top:-27px;font-weight:800;background:#661e1e;color:white;padding:4px 10px;border-radius:7px}.hidden{display:none!important}body.compact #overlay{left:2%;right:2%;bottom:2%}body.compact .board{min-height:74px;grid-template-columns:minmax(130px,1fr) 70px minmax(130px,1fr) 70px 125px}body.compact .team{padding:8px 14px}body.compact .score{font-size:39px}body.compact .clock{font-size:30px}body.compact .strip{font-size:11px;padding:5px 12px}body.compact .period{font-size:11px}@media(max-width:900px){.board{grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr) 60px 108px;min-height:72px}.team{padding:8px}.name{font-size:12px}.stat{font-size:10px}.score{font-size:32px}.clock{font-size:26px}.period{font-size:10px}.strip{font-size:10px}}
</style></head><body><main id="overlay" aria-label="IceBreaker broadcast overlay"><div id="offline" class="offline hidden">SIGNAL LOST</div><div class="board"><div class="team home"><div id="home-name" class="name">HOME</div><div id="home-shots" class="stat">SHOTS 0</div></div><div class="score home" id="home-score">0</div><div class="team away"><div class="name" id="away-name">AWAY</div><div class="stat" id="away-shots">SHOTS 0</div></div><div class="score away" id="away-score">0</div><div class="clockbox"><div class="clock" id="game-clock">15:00</div><div class="period" id="game-period">PERIOD 1</div></div></div><div class="strip"><span class="status" id="game-status">CONNECTING</span><span class="penalty" id="penalties"></span><span id="brand">ICEBREAKER LIVE</span></div></main><script src="/overlay.js" defer></script></body></html>
