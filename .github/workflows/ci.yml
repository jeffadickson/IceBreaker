name: CI
on:
  push:
  pull_request:
jobs:
  node-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manual links
        run: python tools/check_docs.py
      - name: Run local-backend tests
        run: node --test apps/rink-local/tests/browser/*.test.js
      - name: Install Frappe contract test dependencies
        run: python -m pip install 'cryptography>=44,<49'
      - name: Check Frappe app Python syntax and migration rules (no Bench required)
        env:
          PYTHONPATH: apps/frappe/icebreaker_league
        run: |
          python -m compileall -q apps/frappe/icebreaker_league/icebreaker_league
          python -m unittest discover -s apps/frappe/icebreaker_league/tests -p 'test_*.py'
      - name: Run distributed synchronization and architecture integration tests
        run: node --test tests/integration/*.test.js tests/architecture/*.test.js
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test core
        run: dotnet test apps/rink-local/tests/Icebreaker.Core.Tests/Icebreaker.Core.Tests.csproj -c Release
      - name: Build native Avalonia desktop
        run: dotnet build apps/rink-local/src/Icebreaker.Timekeeper.Desktop/Icebreaker.Timekeeper.Desktop.csproj -c Release

  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish native Windows x64 timekeeper
        run: dotnet publish apps/rink-local/src/Icebreaker.Timekeeper.Desktop/Icebreaker.Timekeeper.Desktop.csproj -c Release -r win-x64 --self-contained false -o out/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: IceBreaker-Timekeeper-win-x64
          path: out/desktop/
