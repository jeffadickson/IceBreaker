name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Restore locked Node dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Check documentation, build manifests and tool syntax
        run: |
          python tools/check_docs.py
          python tools/check_build.py
          python -m py_compile tools/icebreaker.py tools/check_build.py
      - name: Run rink-local Node tests
        run: npm test
      - name: Run distributed synchronization and architecture tests
        run: node --test tests/integration/*.test.js tests/architecture/*.test.js
      - name: Verify locked Frappe contract dependencies and run tests
        env:
          PYTHONPATH: apps/frappe/icebreaker_league
        run: |
          uv run --project apps/frappe/icebreaker_league --locked --no-dev python -m compileall -q apps/frappe/icebreaker_league/icebreaker_league
          uv run --project apps/frappe/icebreaker_league --locked --no-dev python -m unittest discover -s apps/frappe/icebreaker_league/tests -p 'test_*.py'

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Restore locked NuGet dependencies
        run: |
          dotnet restore apps/rink-local/tests/Icebreaker.Core.Tests/Icebreaker.Core.Tests.csproj --locked-mode
          dotnet restore apps/rink-local/src/Icebreaker.SpectatorGateway/Icebreaker.SpectatorGateway.csproj --locked-mode
      - name: Test core
        run: dotnet test apps/rink-local/tests/Icebreaker.Core.Tests/Icebreaker.Core.Tests.csproj -c Release --no-restore
      - name: Build native Avalonia desktop
        run: dotnet build apps/rink-local/src/Icebreaker.Timekeeper.Desktop/Icebreaker.Timekeeper.Desktop.csproj -c Release --no-restore
      - name: Build read-only spectator gateway
        run: dotnet build apps/rink-local/src/Icebreaker.SpectatorGateway/Icebreaker.SpectatorGateway.csproj -c Release --no-restore

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages*.lock.json'
      - name: Restore Windows runtime against committed lock
        shell: pwsh
        run: dotnet restore apps/rink-local/src/Icebreaker.Timekeeper.Desktop/Icebreaker.Timekeeper.Desktop.csproj -r win-x64 --locked-mode -p:NuGetLockFilePath=packages.win-x64.lock.json
      - name: Publish native Windows x64 timekeeper
        shell: pwsh
        run: dotnet publish apps/rink-local/src/Icebreaker.Timekeeper.Desktop/Icebreaker.Timekeeper.Desktop.csproj -c Release -r win-x64 --self-contained false --no-restore -p:NuGetLockFilePath=packages.win-x64.lock.json -o out/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: IceBreaker-Timekeeper-win-x64
          path: out/desktop/

  camera-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.26'
          enable-cache: true
      - name: Test optional camera observer with locked dependencies
        run: uv run --project tools/scoreboard-camera --locked python -m unittest discover -s tools/scoreboard-camera -p 'test_*.py'
