name: CI
on:
  push:
  pull_request:
jobs:
  node-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate manual links
        run: python tools/check_docs.py
      - name: Run local-backend tests
        run: node --test apps/rink-local/tests/browser/*.test.js
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test core
        run: dotnet test apps/rink-local/tests/Icebreaker.Core.Tests/Icebreaker.Core.Tests.csproj -c Release
  elsa-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore Elsa dependencies
        run: dotnet restore services/elsa-workflows/IceBreaker.Elsa.csproj
      - name: Build Elsa service
        run: dotnet build services/elsa-workflows/IceBreaker.Elsa.csproj -c Release --no-restore
      - name: Verify bridge tests
        run: node --test tests/integration/elsa-bridge.test.js